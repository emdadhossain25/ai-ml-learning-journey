name: Daily Job Search Automation

on:
  schedule:
    # Runs every day at 9 AM Bangladesh time (3 AM UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  search-jobs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install openai
    
    - name: Run job search automation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # Create config.py with API key from secrets
        echo "OPENAI_API_KEY = '$OPENAI_API_KEY'" > config.py
        cat config_template.py >> config.py
        
        # Run automation
        python3 main.py
    
    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git commit -m "Automated job search results - $(date)" || echo "No changes"
        git push
